name: Pages

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Check website
        run: node tool/check_site.mjs

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
