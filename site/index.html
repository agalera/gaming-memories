<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Collect screenshots and clips from your videogames. Browse every memory.">
    <meta property="og:title" content="Gaming Memories — Your adventures, captured.">
    <meta property="og:description" content="Collect screenshots and clips from your videogames. Browse every memory.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://fmartingr.github.io/gaming-memories/assets/og-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Gaming Memories — Your adventures, captured.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gaming Memories — Your adventures, captured.">
    <meta name="twitter:description" content="Collect screenshots and clips from your videogames. Browse every memory.">
    <meta name="twitter:image" content="https://fmartingr.github.io/gaming-memories/assets/og-card.png">
    <title>Gaming Memories — Your adventures, captured.</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <script src="theme-init.js"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <nav class="nav shell" aria-label="Main navigation">
        <a class="brand" href="index.html" aria-label="Gaming Memories home">
          <img src="assets/logo.webp" alt="" width="38" height="38">
          <span>Gaming Memories</span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links">
          <span class="sr-only">Open navigation</span><span></span><span></span>
        </button>
        <div class="nav-links" id="nav-links">
          <a href="docs.html">Documentation</a>
          <a href="https://github.com/fmartingr/gaming-memories">GitHub</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="Use dark theme" title="Use dark theme">
            <svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.7 15.1A9 9 0 0 1 8.9 3.3 9 9 0 1 0 20.7 15.1Z"></path></svg>
            <svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg>
          </button>
          <a class="nav-download" data-smart-download href="https://github.com/fmartingr/gaming-memories/releases/latest">Download</a>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="hero shell">
        <div class="hero-copy" data-reveal>
          <h1>Your adventures,<br><em>captured.</em></h1>
          <p>Collect screenshots and clips from your videogames. Browse every memory.</p>
          <div class="hero-actions">
            <a class="button button-primary" data-smart-download href="https://github.com/fmartingr/gaming-memories/releases/latest"><span data-download-label>Download latest</span><span aria-hidden="true">↓</span></a>
            <a class="button button-secondary" href="docs.html">Read the docs</a>
          </div>
          <small>For Windows, macOS, and Linux</small>
        </div>

        <figure class="product-figure" data-reveal>
          <div class="screenshot-carousel" data-screenshot-carousel role="group" aria-label="Gaming Memories application screenshots">
            <div class="screenshot-slide is-active" data-screenshot-slide role="img" aria-label="Timeline showing recent Diablo IV captures">
              <img class="screenshot-image screenshot-image-light" src="assets/screenshots/timeline-light.webp" alt="" width="2930" height="1984" fetchpriority="high">
              <img class="screenshot-image screenshot-image-dark" src="assets/screenshots/timeline-dark.webp" alt="" width="2930" height="1984" fetchpriority="high">
            </div>
            <div class="screenshot-slide" data-screenshot-slide role="img" aria-label="PC game library showing cover art" aria-hidden="true">
              <img class="screenshot-image screenshot-image-light" src="assets/screenshots/gamelist-light.webp" alt="" width="2930" height="1984" loading="lazy">
              <img class="screenshot-image screenshot-image-dark" src="assets/screenshots/gamelist-dark.webp" alt="" width="2930" height="1984" loading="lazy">
            </div>
            <div class="screenshot-slide" data-screenshot-slide role="img" aria-label="Terraria capture gallery" aria-hidden="true">
              <img class="screenshot-image screenshot-image-light" src="assets/screenshots/imagelist-light.webp" alt="" width="2930" height="1984" loading="lazy">
              <img class="screenshot-image screenshot-image-dark" src="assets/screenshots/imagelist-dark.webp" alt="" width="2930" height="1984" loading="lazy">
            </div>
          </div>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <div class="shell footer-main">
        <a class="brand" href="index.html"><img src="assets/logo.webp" alt="" width="38" height="38"><span>Gaming Memories</span></a>
        <nav aria-label="Footer navigation"><a href="docs.html">Documentation</a><a href="https://github.com/fmartingr/gaming-memories">GitHub</a><a href="https://github.com/fmartingr/gaming-memories/issues">Issues</a><a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3.0</a></nav>
      </div>
      <div class="shell footer-bottom"><span>Windows · macOS · Linux</span></div>
    </footer>
  </body>
</html>
